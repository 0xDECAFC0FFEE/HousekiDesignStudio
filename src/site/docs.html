<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Documentation | Houseki Design Studio</title>
<meta name="description" content="Documentation for Houseki Design Studio, the in-browser gem cut designer and planner, is coming soon.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2e3440">
<meta name="color-scheme" content="dark light">
@@THEME_SCRIPT@@
<link rel="icon" href="@@LOGO_ICON@@">
<style>
  :root {
    --panel: #2e3440;
    --panel-edge: #4c566a;
    --raised: #3b4252;
    --text: #eceff4;
    --muted: #d8dee9;
    --accent: #8fbcbb;
    --on-accent: #2e3440;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; min-height: 100%; }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    background: var(--panel);
    color: var(--text);
    font: 17px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    width: 100%;
    max-width: 44rem;
    margin: 0 auto;
    padding: 4rem 1rem;
  }

  .mark { width: 56px; height: 56px; margin-bottom: 1.5rem; }

  h1 {
    margin: 0 0 1.25rem;
    font-size: clamp(2rem, 6vw, 3rem);
    line-height: 1.15;
    letter-spacing: -0.01em;
  }

  p { margin: 0 0 2rem; color: var(--muted); }

  .version { margin-top: -1rem; font-size: 0.9rem; }

  nav ul {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  nav a {
    display: inline-block;
    padding: 0.6rem 1.25rem;
    border: 1px solid var(--panel-edge);
    border-radius: 6px;
    background: var(--raised);
    color: var(--text);
    font-weight: 600;
    text-decoration: none;
  }

  nav a.primary { border-color: var(--accent); background: var(--accent); color: var(--on-accent); }

  nav a:hover { border-color: var(--accent); }
  nav a.primary:hover { background: #a3c9c8; }

  nav a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* The footer's name stays centred, with the light/dark toggle at its right. */
  footer {
    position: relative;
    padding: 1.5rem 1rem;
    border-top: 3px double var(--panel-edge);
    color: var(--muted);
    font-size: 0.8rem;
    text-align: center;
  }

  footer .theme-toggle {
    position: absolute;
    top: 50%;
    right: 1rem;
    transform: translateY(-50%);
  }
</style>
@@THEME_STYLE@@
</head>
<body>
<main>
  @@LOGO@@
  <h1>Documentation</h1>
  <p>Coming soon!</p>
  <p class="version">Version 0.1.0</p>
  <nav aria-label="Where next">
    <ul>
      <li><a class="primary" href="houseki.html">Open the design studio</a></li>
      <li><a href="index.html">Back to the home page</a></li>
    </ul>
  </nav>
</main>
<footer>
  <span>Houseki Design Studio</span>
  <!-- The light/dark toggle, the same as the app's (site/theme.css, site/theme.js). -->
  <button type="button" class="theme-toggle" data-theme-toggle aria-label="Light mode" aria-pressed="false" title="Switch between dark and light colors">
    <svg class="theme-toggle-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
    <svg class="theme-toggle-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2m-7.07-17.07 1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
  </button>
</footer>
</body>
</html>
